<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smugglers' Den</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page">
    <header class="top">
      <div class="intro">
        <h1>Smugglers' Den</h1>

        <section id="join-section">
          <form id="join-form">
            <label>
              Name
              <input id="name" maxlength="20" autocomplete="off" required />
            </label>
            <button type="submit">Join</button>
          </form>
          <p id="join-error" class="error"></p>
        </section>
      </div>

      <div class="players">
        <h2>Players</h2>
        <ul id="seats"></ul>

        <button id="start" type="button" disabled>Start game</button>
        <button id="reset" type="button" disabled>Reset game</button>
        <p id="start-error" class="error"></p>
        <div class="status">
          <p><span id="phase"></span> <span id="round"></span></p>
          <p id="you"></p>
          <p id="results"></p>
        </div>
      </div>
    </header>

    <main class="main">
    <section id="hand-section">
      <h2 id="hand-title">Your hand</h2>
      <div id="declare" class="cards"></div>
      <div id="hand" class="cards">No cards dealt yet.</div>
      <div id="pack-controls">
        <label>
          Bribe
          <input id="bribe" type="range" min="0" max="0" value="0" disabled />
        </label>
        <span id="bribe-value">0</span>
        <button id="submit-pack" type="button" disabled>Submit to inspector</button>
        <p id="pack-error" class="error"></p>
      </div>
    </section>

    <section>
      <h2>Packages</h2>
      <ul id="packages"></ul>
      <p id="inspect-error" class="error"></p>
      <div id="revise-controls" hidden>
        <label>
          Revise bribe
          <input id="revise-bribe" type="range" min="0" max="0" value="0" />
        </label>
        <span id="revise-value">0</span>
        <button id="submit-revise" type="button">Set bribe</button>
        <p id="revise-error" class="error"></p>
      </div>
    </section>
    </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js" defer></script>
  </body>
</html>
